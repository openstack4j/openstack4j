name: Publish to Maven Central

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    publish:
        if: github.repository == 'spechurkin/openstack4j' && github.ref_type == 'tag'
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
                with:
                    persist-credentials: false
            -   uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
                with:
                    distribution: temurin
                    java-version: '17'
                    cache: maven
                    server-id: central
                    server-username: CENTRAL_USERNAME
                    server-password: CENTRAL_TOKEN
                    gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
                    gpg-passphrase: MAVEN_GPG_PASSPHRASE
            -   name: Verify release version
                run: |
                    VERSION=$(python3 -c "from xml.etree import ElementTree as ET; print(ET.parse('pom.xml').findtext('{*}version'))")
                    if [[ "$GITHUB_REF_NAME" != "v$VERSION" || "$VERSION" == *-SNAPSHOT ]]; then
                        echo "::error::The tag must be v followed by the release version in pom.xml"
                        exit 1
                    fi
            -   name: Build, sign and publish
                run: mvn -B --no-transfer-progress -Prelease,central deploy
                env:
                    CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
                    CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
                    MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
