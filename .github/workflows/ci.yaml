name: openstack4j CI

on:
    push:
        branches: ['**']
    pull_request:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-24.04

        strategy:
            matrix:
                java-version: [ 11, 17, 21 ]

        steps:
            -   uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
                with:
                    persist-credentials: false
            -   uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
                with:
                    distribution: 'temurin'
                    java-version: ${{ matrix.java-version }}
            -   run: mvn -B install --no-transfer-progress --update-snapshots
            -   name: Run packaged distribution on Java 8
                if: matrix.java-version == 11
                run: |
                    jars=(distribution/target/*-withdeps.jar)
                    "${JAVA_HOME_8_X64:?}/bin/java" \
                        -cp "distribution/target/test-classes:${jars[0]}" org.openstack4j.Java8Smoke
