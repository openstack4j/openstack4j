name: Publish OpenStack4j 4.0.0 packages

on: workflow_dispatch

permissions:
    contents: read

concurrency: publish-openstack4j-4.0.0

env:
    RELEASE_TAG: v4.0.0
    RELEASE_COMMIT: d80cadbbc730a0e2cc0cdfedc4336b5a5ae7f09b

jobs:
    verify:
        if: github.repository == 'spechurkin/openstack4j' && github.ref_name == github.event.repository.default_branch
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
                with:
                    ref: ${{ env.RELEASE_COMMIT }}
                    fetch-depth: 0
                    persist-credentials: false
            -   name: Verify release tag
                shell: bash
                env:
                    DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
                run: |
                    if [[ "$DEFAULT_BRANCH" != main && "$DEFAULT_BRANCH" != master ]]; then
                        echo '::error::The default branch must be main or master.'
                        exit 1
                    fi
                    tag_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
                    if [[ "$tag_commit" != "$RELEASE_COMMIT" || "$(git rev-parse HEAD)" != "$RELEASE_COMMIT" ]] ||
                        ! git merge-base --is-ancestor "$RELEASE_COMMIT" "refs/remotes/origin/$DEFAULT_BRANCH"; then
                        echo '::error::The release tag must identify the verified commit on the default branch.'
                        exit 1
                    fi
                    version=$(python3 -c "from xml.etree import ElementTree as ET; print(ET.parse('pom.xml').findtext('{*}version'))")
                    if [[ "$RELEASE_TAG" != "v$version" ]]; then
                        echo '::error::The release tag must match the version in pom.xml.'
                        exit 1
                    fi
            -   uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
                with:
                    distribution: temurin
                    java-version: '17'
            -   name: Verify Maven build
                run: mvn -B --no-transfer-progress -Prelease verify

    github-packages:
        needs: verify
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            -   uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
                with:
                    ref: ${{ env.RELEASE_COMMIT }}
                    persist-credentials: false
            -   uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
                with:
                    distribution: temurin
                    java-version: '17'
                    server-id: github
            -   name: Publish to GitHub Packages
                run: >-
                    mvn -B --no-transfer-progress -Prelease -DskipTests -DdeployAtEnd=true
                    "-DaltDeploymentRepository=github::https://maven.pkg.github.com/$GITHUB_REPOSITORY" deploy
                env:
                    GITHUB_TOKEN: ${{ github.token }}

    maven-central:
        needs: verify
        runs-on: ubuntu-latest
        steps:
            -   name: Check publishing credentials
                shell: bash
                env:
                    CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
                    CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
                    GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
                run: |
                    if [[ -z "$CENTRAL_USERNAME" || -z "$CENTRAL_TOKEN" || -z "$GPG_PRIVATE_KEY" ]]; then
                        echo '::error::Configure CENTRAL_USERNAME, CENTRAL_TOKEN and GPG_PRIVATE_KEY in Actions secrets.'
                        exit 1
                    fi
            -   uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
                with:
                    ref: ${{ env.RELEASE_COMMIT }}
                    persist-credentials: false
            -   uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
                with:
                    distribution: temurin
                    java-version: '17'
                    server-id: central
                    server-username: CENTRAL_USERNAME
                    server-password: CENTRAL_TOKEN
                    gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
                    gpg-passphrase: MAVEN_GPG_PASSPHRASE
            -   name: Sign and publish to Maven Central
                run: mvn -B --no-transfer-progress -Prelease,central -DskipTests deploy
                env:
                    CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
                    CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
                    MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
