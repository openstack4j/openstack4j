name-template: 'OpenStack SDK $RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
    - title: 'Breaking Changes'
      labels: [ 'breaking' ]
    - title: 'Features'
      labels: [ 'feature', 'enhancement' ]
    - title: 'Fixes'
      labels: [ 'bug', 'fix' ]
    - title: 'Dependencies'
      labels: [ 'dependencies' ]
template: |
    ## Changes

    $CHANGES
